name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:        # lets you press "Run workflow" manually in the Actions tab

permissions:
  contents: write           # needed only for publishing a Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The permanent release key. Add these four in Settings > Secrets and variables > Actions (see README).
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The project has no gradle wrapper, so install Gradle directly (AGP 8.5.2 needs 8.7+)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Inter is downloaded from its official release if you have not added it yourself. Kalpurush.ttf must be
      # added by hand to app/src/main/assets/fonts/ (see the README there).
      - name: Fetch Inter font if missing
        run: |
          dir=app/src/main/assets/fonts
          mkdir -p "$dir"
          if [ ! -f "$dir/Inter-Regular.ttf" ] || [ ! -f "$dir/Inter-Bold.ttf" ]; then
            tmp=$(mktemp -d)
            if curl -fsSL "https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip" -o "$tmp/inter.zip" && unzip -q "$tmp/inter.zip" -d "$tmp/x"; then
              for f in Inter-Regular.ttf Inter-Bold.ttf; do
                if [ ! -f "$dir/$f" ]; then
                  src=$(find "$tmp/x" -name "$f" | head -n 1)
                  if [ -n "$src" ]; then cp "$src" "$dir/$f"; else echo "Could not find $f in the Inter download"; fi
                fi
              done
              if [ ! -f "$dir/OFL-Inter.txt" ]; then
                lic=$(find "$tmp/x" -iname "LICENSE.txt" | head -n 1)
                if [ -n "$lic" ]; then cp "$lic" "$dir/OFL-Inter.txt"; fi
              fi
            else
              echo "Could not download Inter"
            fi
          fi

      # Restores the permanent keystore from the KEYSTORE_BASE64 secret. Pull requests from forks get no secrets,
      # so they (and runs where the secret is missing) fall back to the debug key and show a warning.
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing. The release APK is signed with a debug key and cannot update an older install."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PdfManager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The optimized (R8) build: smaller and noticeably faster than the debug APK. Use this one day to day.
      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: PdfManager-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Tag a version (e.g. `git tag v0.1 && git push --tags`) to also get a downloadable Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # The signed, optimized APK (built above, before the no-R8 build replaces the release folder)
          files: app/build/outputs/apk/release/*.apk

      # Fallback without R8. Install this one if a feature misbehaves in the optimized APK.
      - name: Build release APK without R8
        run: gradle assembleRelease -PnoR8 --stacktrace

      - name: Upload release APK without R8
        uses: actions/upload-artifact@v4
        with:
          name: PdfManager-release-safe-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Checks run after the APKs are built, so a failing test or lint warning never blocks getting an APK,
      # but the run turns red and the reports are attached.
      - name: Run unit tests
        if: always()
        run: gradle :app:testDebugUnitTest --stacktrace

      # Lint is advisory here: it reports problems in the attached report but does not turn the run red
      - name: Run Android Lint
        if: always()
        continue-on-error: true
        run: gradle :app:lintDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PdfManager-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
