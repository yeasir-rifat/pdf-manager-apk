name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:        # lets you press "Run workflow" manually in the Actions tab

permissions:
  contents: write           # needed only for publishing a Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The project has no gradle wrapper, so install Gradle directly (AGP 8.5.2 needs 8.7+)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Lato is downloaded if you have not added it yourself. Kalpurush.ttf must be added by hand
      # to app/src/main/assets/fonts/ (see the README there).
      - name: Fetch Lato font if missing
        run: |
          mkdir -p app/src/main/assets/fonts
          for f in Lato-Regular.ttf Lato-Bold.ttf; do
            [ -f "app/src/main/assets/fonts/$f" ] || curl -fsSL "https://github.com/google/fonts/raw/main/ofl/lato/$f" -o "app/src/main/assets/fonts/$f" || echo "Could not download $f"
          done

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PdfManager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The optimized (R8) build: smaller and noticeably faster than the debug APK. Use this one day to day.
      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: PdfManager-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Tag a version (e.g. `git tag v0.1 && git push --tags`) to also get a downloadable Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk

      # Fallback without R8. Install this one if a feature misbehaves in the optimized APK.
      - name: Build release APK without R8
        run: gradle assembleRelease -PnoR8 --stacktrace

      - name: Upload release APK without R8
        uses: actions/upload-artifact@v4
        with:
          name: PdfManager-release-safe-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Checks run after the APKs are built, so a failing test or lint warning never blocks getting an APK,
      # but the run turns red and the reports are attached.
      - name: Run unit tests
        if: always()
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android Lint
        if: always()
        run: gradle :app:lintDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PdfManager-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
